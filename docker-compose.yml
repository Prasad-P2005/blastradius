# Local infra for Blastradius. Host ports are configurable because many dev
# machines already run Redis on 6379 / Postgres on 5432.
#   FALKORDB_PORT (default 6380) -> container 6379
#   FALKORDB_UI_PORT (default 3001) -> FalkorDB browser (container 3000; Next.js owns 3000)
#   POSTGRES_PORT (default 5434) -> container 5432
services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "${FALKORDB_PORT:-6380}:6379"
      - "${FALKORDB_UI_PORT:-3001}:3000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: blast
      POSTGRES_PASSWORD: blast
      POSTGRES_DB: blastradius
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blast -d blastradius"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  falkordb-data:
  pg-data:
